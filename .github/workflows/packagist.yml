name: Publish to Packagist

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to recheck and synchronize (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packagist-publication
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  update:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update Packagist and verify the indexed version
        run: node .github/scripts/update-packagist.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
